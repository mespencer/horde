// Usage accounting: per-Agent records, per-account headroom, tree aggregation.
syntax = "proto3";

package horde.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "horde/v1/agent.proto";
import "horde/v1/id.proto";

message TokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_input_tokens = 3;
  uint64 cache_write_input_tokens = 4;

  // Reasoning tokens, where the provider bills and reports them separately.
  // Included in `output_tokens` or not depending on the provider, so this is a
  // breakdown for attribution, never an addend — summing the two double-counts
  // on providers that already fold reasoning into output.
  uint64 reasoning_output_tokens = 5;
}

// Where a RateWindow's numbers came from. Provider-reported state is truth
// where the provider exposes it; otherwise Horde meters against a declared
// quota model. Every token flows through Horde, so it is never blind — but the
// two sources have different trust, and callers must be able to tell them apart.
enum HeadroomSource {
  HEADROOM_SOURCE_UNSPECIFIED = 0;
  HEADROOM_SOURCE_PROVIDER_REPORTED = 1;
  HEADROOM_SOURCE_HORDE_METERED = 2;
}

enum RateWindowUnit {
  RATE_WINDOW_UNIT_UNSPECIFIED = 0;
  RATE_WINDOW_UNIT_TOKENS = 1;
  RATE_WINDOW_UNIT_REQUESTS = 2;
}

// Rate-limit state for one Provider Account. Drives the `headroom` selection
// strategy.
message RateWindow {
  HeadroomSource source = 1;

  // Meaningful only alongside absolute counts; leave UNSPECIFIED when a
  // provider reports percentage only.
  RateWindowUnit unit = 2;

  // Absolute consumption, when the provider reports counts. Optional because
  // some providers report only a percentage — Codex reports `usedPercent` with
  // no counts at all (ADR-0005). Absent is not zero.
  optional uint64 used = 3;

  // Absent means the provider does not publish a ceiling, which is distinct
  // from a ceiling of zero.
  optional uint64 limit = 4;

  google.protobuf.Duration window_length = 5;

  google.protobuf.Timestamp resets_at = 6;

  // Fraction of the window consumed, 0.0–1.0, for providers that report a
  // percentage instead of counts.
  //
  // Both shapes are modelled rather than normalising to one, because either
  // conversion is lossy: percent → counts needs a ceiling the provider never
  // sent, and counts → percent discards the ceiling the provider did send. A
  // RateWindow carries whichever shape its provider actually reports, and may
  // carry both; consumers must handle a window with only one.
  optional double used_fraction = 7;

  // Whether the provider is still serving requests, for providers that report
  // nothing but that.
  //
  // Claude Code's rate-limit event is exactly this shape (spike W1c/W2c): a
  // window name, a status, and a reset time, with no quantity in either other
  // shape. Without this field that state has nowhere to land, and the only
  // encodings available are lies — `used_fraction = 1.0` invents exhaustion,
  // and absence claims the provider said nothing when it did say "still
  // serving".
  optional bool allowed = 8;
}

// One metered turn, attributable to an Agent and a Provider Account.
message UsageRecord {
  ModelBinding binding = 1;

  TokenUsage tokens = 2;

  // Account headroom as of this record, when the adapter reports it.
  RateWindow rate_window = 3;

  // Correlates the record with the turn's output chunks.
  string turn_id = 4;
}

// One Provider Account's standing, as a usage query reports it: the measured
// facts beside the arithmetic derived from them, never blended. `window` and
// `tokens` are measured — journaled rate-limit state and summed usage records.
// `remaining_fraction` and `exhausted` are derived, and `basis` says from
// what, so a reader can always tell a provider's own number from Horde's
// arithmetic over it.
message AccountHeadroom {
  string provider = 1;

  // Account name, as the Worker advertises it.
  string account = 2;

  // Measured: the latest rate-limit state journaled for this account, absent
  // when no adapter has reported one.
  RateWindow window = 3;

  // Derived: fraction of the window remaining, 0.0–1.0. Absent when the
  // window carries nothing it can be derived from (serving-state-only
  // windows, or no window at all) — absent is "unknown", never zero.
  optional double remaining_fraction = 4;

  // Derived: nothing is left before the limit, and the window's own reset has
  // not passed at query time. The scheduler names exhausted accounts in queue
  // reasons; this is the same predicate, surfaced to clients.
  bool exhausted = 5;

  // Measured: this account's tokens summed from the journaled usage records
  // the query covered.
  TokenUsage tokens = 6;

  // Where the derived numbers came from, in words: "derived from
  // provider-reported counts", "no rate window journaled", ...
  string basis = 7;
}

enum UsageGroupBy {
  USAGE_GROUP_BY_UNSPECIFIED = 0;
  USAGE_GROUP_BY_AGENT = 1;
  USAGE_GROUP_BY_SESSION = 2;
  USAGE_GROUP_BY_TREE_PATH = 3;
  USAGE_GROUP_BY_PROVIDER_ACCOUNT = 4;
  USAGE_GROUP_BY_MODEL = 5;
}

// The dimensions of one aggregate row. Only the fields implied by the query's
// UsageGroupBy are populated.
message UsageGroupKey {
  SessionId session_id = 1;
  AgentId agent_id = 2;
  repeated string tree_path = 3;
  string provider = 4;
  string provider_account = 5;
  string model = 6;
}

message UsageAggregate {
  UsageGroupKey key = 1;

  TokenUsage tokens = 2;

  uint64 agent_count = 3;
}
