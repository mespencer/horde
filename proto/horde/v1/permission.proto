// The permission chain: deterministic deny, deterministic allow, Policy Judge,
// human approval.
syntax = "proto3";

package horde.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "horde/v1/forward.proto";
import "horde/v1/id.proto";

// The layers, in evaluation order. Used both for "who decided" and for "which
// layer gave up and escalated".
enum PermissionLayer {
  PERMISSION_LAYER_UNSPECIFIED = 0;
  PERMISSION_LAYER_DETERMINISTIC_DENY = 1;
  PERMISSION_LAYER_DETERMINISTIC_ALLOW = 2;
  PERMISSION_LAYER_POLICY_JUDGE = 3;
  PERMISSION_LAYER_HUMAN = 4;
}

enum PermissionOutcome {
  PERMISSION_OUTCOME_UNSPECIFIED = 0;
  PERMISSION_OUTCOME_ALLOW = 1;
  PERMISSION_OUTCOME_DENY = 2;
}

// The tool call being judged, as the harness proposed it.
message ProposedToolCall {
  string tool_name = 1;

  // Arguments as the harness supplied them. Structured rather than a JSON
  // string so deterministic rules and the Policy Judge read the same values.
  google.protobuf.Struct input = 2;

  // Human-readable rendering for approval UIs, e.g. "docker rm horde-test".
  string rendered = 3;

  // Set when the harness is asking the human a question rather than (or as
  // well as) asking to run something: Claude's AskUserQuestion, codex's
  // item/tool/requestUserInput. A request carrying questions is never settled
  // by a deterministic rule or the Policy Judge — only a human can answer it,
  // and the answer rides PermissionDecision.answers (W12c).
  repeated Question questions = 4;
}

// One question a harness asked, with the options it offered.
message Question {
  // The key the answer is filed under: codex's question id, or Claude's
  // question text (Claude keys its answers by the question itself).
  string id = 1;

  // A short label for the question, e.g. "Colour".
  string header = 2;

  // The question as the harness asked it.
  string question = 3;

  // The choices offered. Empty means free text only.
  repeated QuestionOption options = 4;

  // Whether more than one option may be chosen.
  bool multi_select = 5;

  // Whether an answer outside the offered options is acceptable.
  bool allows_free_text = 6;

  // Whether the answer is a secret a client should not echo.
  bool secret = 7;
}

message QuestionOption {
  string label = 1;

  string description = 2;
}

// The answer to one Question: the chosen option labels, or free text.
message Answer {
  repeated string values = 1;
}

// An escalation awaiting a decision. Rides the event log like everything else,
// which is what makes it answerable from any connected Client.
message PermissionRequest {
  PermissionRequestId request_id = 1;

  AgentId agent_id = 2;

  ProposedToolCall tool_call = 3;

  // Ancestry for the approver: ["ci-fix", "reviewer", "test-runner"].
  repeated string tree_path = 4;

  // The named mode that was in force.
  string permission_mode = 5;

  // The layer that escalated. HUMAN never appears here.
  PermissionLayer escalated_from = 6;

  // After this, the request is dead and the Agent is unblocked as a denial.
  google.protobuf.Timestamp expires_at = 7;

  // Set when the proposal is a port forward (ADR-0006): an ALLOW on this
  // request is what journals the ForwardOpened. For an EXPOSE the chain's
  // modes apply like any proposed action; for an INJECT the chain always
  // escalates, because acceptance and backing are one act and only a
  // Client's connection can back one — the first Client to accept becomes
  // the backer.
  ForwardSpec forward = 8;
}

message PermissionDecision {
  PermissionRequestId request_id = 1;

  PermissionOutcome outcome = 2;

  // Which layer produced this decision.
  PermissionLayer decided_by = 3;

  // Which principal, when the layer was HUMAN. Multi-attach means several
  // Clients could have answered.
  Actor decided_by_actor = 4;

  // Judge rationale or human note.
  string reason = 5;

  // Widen the deterministic-allow layer for the rest of the Session.
  bool remember_for_session = 6;

  // Replacement arguments, when the chain narrowed the call rather than merely
  // permitting it — clamping a path, dropping a flag.
  //
  // Meaningful only with outcome ALLOW. Spike W1c proved this is real rather
  // than theoretical: Claude Code executes the arguments the permission tool
  // returns, not the ones the model proposed. Without it on the wire, a
  // narrowing decision dies between Server and Worker and the original call
  // runs unmodified.
  //
  // Absent and empty are different states and both matter: absent means "allow
  // as proposed", an empty Struct means "allow with no arguments at all". A
  // Worker whose adapter cannot rewrite arguments must reject a decision
  // carrying this field rather than drop it, so a narrowing that failed to
  // apply is never mistaken for one that took effect.
  google.protobuf.Struct updated_input = 7;

  // Answers to the request's ProposedToolCall.questions, keyed by Question.id.
  //
  // Meaningful only with outcome ALLOW on a request that carried questions:
  // an ALLOW without answers on a question is refused at the Server, and
  // answers on a request that asked nothing are refused too, so a client can
  // never believe it answered something the harness did not hear.
  map<string, Answer> answers = 8;
}
