// The event log — the resilience mechanism (ADR-0001).
//
// Every Session has an append-only, sequence-numbered log on the Server. All
// Client and Worker streams are "sync me from offset N", so reconnect, attach,
// scrollback, crash recovery, and usage attribution are one mechanism rather
// than five features. Everything that matters is an event; side channels are
// bugs.
//
// Two sequence spaces exist and must not be confused:
//   * EventEnvelope.sequence     — per Session, assigned by the Server. What
//                                  Clients resume from.
//   * JournaledEvent.journal_sequence — per Worker, assigned by the Worker's
//                                  local journal. What the Server acks so a
//                                  partitioned Worker knows what to replay.
syntax = "proto3";

package horde.v1;

import "google/protobuf/timestamp.proto";
import "horde/v1/agent.proto";
import "horde/v1/forward.proto";
import "horde/v1/handshake.proto";
import "horde/v1/id.proto";
import "horde/v1/login.proto";
import "horde/v1/mcp.proto";
import "horde/v1/permission.proto";
import "horde/v1/usage.proto";
import "horde/v1/worker.proto";
import "horde/v1/workspace.proto";

// ---------------------------------------------------------------------------
// Event kinds
// ---------------------------------------------------------------------------

// Which stream of an Agent's turn a chunk belongs to. Clients render these
// differently; the log keeps them distinguishable rather than pre-flattened.
enum AgentOutputChannel {
  AGENT_OUTPUT_CHANNEL_UNSPECIFIED = 0;
  AGENT_OUTPUT_CHANNEL_ASSISTANT = 1;
  AGENT_OUTPUT_CHANNEL_REASONING = 2;
  AGENT_OUTPUT_CHANNEL_TOOL_CALL = 3;
  AGENT_OUTPUT_CHANNEL_TOOL_RESULT = 4;

  // Harness-level noise: warnings, retries, rate-limit notices.
  AGENT_OUTPUT_CHANNEL_HARNESS_DIAGNOSTIC = 5;
}

message AgentOutputChunk {
  AgentOutputChannel channel = 1;

  string text = 2;

  // Groups chunks and usage records belonging to one turn.
  string turn_id = 3;

  // Position within the turn and channel. Lets a Client detect a gap without
  // consulting the Session sequence, which interleaves all Agents.
  uint64 chunk_index = 4;
}

// An Agent came into existence. Event.agent_id is the new Agent.
message AgentSpawned {
  // Unset for the Session's top-level Agent.
  AgentId parent_agent_id = 1;

  Actor spawned_by = 2;

  AgentSpec spec = 3;

  // Ancestry display names, root first.
  repeated string tree_path = 4;

  // The Session's own settings (ADR-0016's session layer). Set only on a
  // Session's top-level Agent, from CreateSessionRequest.settings.
  SessionSettings session = 5;
}

// Event.agent_id is the recipient; `from` is the sender.
message AssignmentSent {
  Actor from = 1;

  Assignment assignment = 2;

  DeliveryMode delivery = 3;
}

// Event.agent_id is the recipient.
message NoteSent {
  Actor from = 1;

  Note note = 2;

  DeliveryMode delivery = 3;
}

// Event.agent_id is the reporting Agent. Reporting does not end the Agent; it
// goes idle with context retained.
message ResultReported {
  AgentResult result = 1;
}

message PermissionRequested {
  PermissionRequest request = 1;
}

message PermissionDecided {
  PermissionDecision decision = 1;
}

message UsageRecorded {
  UsageRecord record = 1;
}

// A Workspace Instance was created, progressed, or went away. Carries
// materialization progress so `prewarm` is visible in the Session.
message WorkspaceInstanceChanged {
  WorkspaceInstanceReport report = 1;

  // Present while state is MATERIALIZING.
  MaterializationProgress progress = 2;
}

message AgentLifecycleChanged {
  AgentLifecycleState previous_state = 1;

  AgentLifecycleState state = 2;

  // Why, in words: "reaped after 60m idle", "harness exited with status 1".
  string reason = 3;
}

message SessionLifecycleChanged {
  SessionLifecycleState previous_state = 1;

  SessionLifecycleState state = 2;

  string reason = 3;
}

// Placement was made, refused, or expired. Queued-with-reason is a first-class
// outcome: spawn never blocks the caller.
message PlacementChanged {
  Placement placement = 1;

  // What the placed Agent's adapter can do on the Worker it was placed on, as
  // that Worker advertised it at placement time (ADR-0009). Set only for a
  // PLACED outcome. Stamped here so a capability the permission chain must
  // honor — TOOL_INPUT_REWRITE, without which a narrowing decision cannot be
  // applied — is a fact of the log rather than a lookup in a live registry
  // that a disconnect or restart forgets. Absent reads as "none": an Agent
  // placed before this field existed is treated as unable to rewrite.
  repeated AdapterCapability adapter_capabilities = 2;
}

// The catalog of Workspace Definitions changed: one was created, updated,
// widened by AddWorkspaceRepo, or deleted. Carries the full post-change
// Definition rather than a delta, so the catalog fold is last-writer-wins and
// a replay from any offset converges on the same catalog.
message WorkspaceDefinitionChanged {
  WorkspaceDefinition definition = 1;

  // The Definition no longer exists. The event still carries its last state,
  // so the log alone records what was deleted.
  bool deleted = 2;
}

// The Server asked a Worker to materialize a Workspace Instance — at
// placement time, or via an explicit prewarm. The command fold turns this into
// a MaterializeWorkspaceCommand; recording the request as an event is what
// lets the command survive a Server restart (ADR-0001).
message WorkspacePrewarmRequested {
  WorkspaceDefinitionId workspace_definition_id = 1;

  WorkerId worker_id = 2;
}

// An enrollment code was minted (DESIGN §3). Records the SHA-256 of the
// code's one-time secret — never the secret itself, because attached clients
// replay the log and a readable secret is a mintable identity — along with
// the principal the code will create and when it stops working. Enrollment
// events live in a reserved stream, like the Workspace Definition catalog.
message EnrollmentCodeMinted {
  // Whether the code enrolls a Worker or a Client.
  Role role = 1;

  // The principal name the code will enroll, fixed at mint time.
  string name = 2;

  // SHA-256 of the one-time secret, lowercase hex.
  string code_hash = 3;

  google.protobuf.Timestamp expires_at = 4;
}

// A machine redeemed a code and was issued its identity. The record of who
// is enrolled; the serial is what revocation keys on.
message IdentityEnrolled {
  Role role = 1;

  string name = 2;

  // Serial of the issued certificate, lowercase hex.
  string certificate_serial = 3;

  // The hash of the code that was redeemed, which this event spends.
  string code_hash = 4;
}

// A principal's certificate was revoked: its serial joins the per-serial
// deny-list every channel door checks (DESIGN §3).
message EnrollmentRevoked {
  Role role = 1;

  string name = 2;

  string certificate_serial = 3;

  string reason = 4;
}

// A turn in flight was cancelled. Distinct from a queued message, which is a
// delivery mode on AssignmentSent or NoteSent.
message TurnInterrupted {
  Actor requested_by = 1;

  string turn_id = 2;

  string reason = 3;
}

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

// One thing that happened, without log coordinates. Split from EventEnvelope so
// a Worker can journal an event before the Server has assigned it a Session
// sequence.
message Event {
  // The Agent this event is about. Unset for Session-scoped events.
  AgentId agent_id = 1;

  // When the originator observed it. May precede recorded_at by the length of a
  // partition.
  google.protobuf.Timestamp occurred_at = 2;

  // Stable across replays of the same event, so a Worker replaying its journal
  // after reconnect cannot double-append. Worker-assigned and opaque.
  string idempotency_key = 3;

  oneof kind {
    AgentOutputChunk agent_output_chunk = 10;
    AgentSpawned agent_spawned = 11;
    AssignmentSent assignment_sent = 12;
    NoteSent note_sent = 13;
    ResultReported result_reported = 14;
    PermissionRequested permission_requested = 15;
    PermissionDecided permission_decided = 16;
    UsageRecorded usage_recorded = 17;
    WorkspaceInstanceChanged workspace_instance_changed = 18;
    AgentLifecycleChanged agent_lifecycle_changed = 19;
    SessionLifecycleChanged session_lifecycle_changed = 20;
    PlacementChanged placement_changed = 21;
    TurnInterrupted turn_interrupted = 22;
    WorkspaceDefinitionChanged workspace_definition_changed = 23;
    WorkspacePrewarmRequested workspace_prewarm_requested = 24;
    EnrollmentCodeMinted enrollment_code_minted = 25;
    IdentityEnrolled identity_enrolled = 26;
    EnrollmentRevoked enrollment_revoked = 27;

    // The MCP Hub catalog changed (ADR-0004). Lives in a reserved stream,
    // like the Workspace Definition catalog; the message is in mcp.proto
    // beside the config it carries.
    McpServerConfigChanged mcp_server_config_changed = 28;

    // A port-forward intent opened or closed (ADR-0006). Durable intent
    // only; the tunnel plane realizing it never touches the log.
    ForwardOpened forward_opened = 29;
    ForwardClosed forward_closed = 30;

    // An interactive login started or ended on a Worker (DESIGN §4). Lives
    // in a reserved stream like enrollment; audit trail only — a login is
    // EPHEMERAL intent whose liveness is the relay's in-memory pairing,
    // never a fold over these.
    WorkerLoginStarted worker_login_started = 31;
    WorkerLoginEnded worker_login_ended = 32;

    // A Worker journaled an event the Server refused to append (ADR-0009).
    // Lives in the reserved dead-letter stream.
    JournalEventRefused journal_event_refused = 33;

    // A Worker journaled an event about an Agent it used to hold, after the
    // Agent was placed elsewhere or declared lost (ADR-0011). Lives in the
    // Agent's own Session, so it is visible where the Agent is.
    StaleJournalEvent stale_journal_event = 34;

    // An operator reset a Worker's journal (ADR-0011). Lives in the reserved
    // worker-journal stream.
    WorkerJournalReset worker_journal_reset = 35;

    // Workspaces (ADR-0014). CheckoutPrepared lives in the agent's Session;
    // the rest live in the reserved workspace-housekeeping stream.
    CheckoutPrepared checkout_prepared = 36;
    WorkspaceCleanup workspace_cleanup = 37;
    WorkspaceGcRequested workspace_gc_requested = 38;
    WorkspaceGcCompleted workspace_gc_completed = 39;
    WorkspaceDiskPressure workspace_disk_pressure = 40;
  }
}

// Per agent, in its Session: exactly what each repo of a checkout started
// from. Journaled at spawn (all initial repos) and at each
// workspace_checkout (one repo).
message CheckoutPrepared {
  enum BaseResolution {
    BASE_RESOLUTION_UNSPECIFIED = 0;

    // origin/<default>, fetched within the throttle.
    BASE_RESOLUTION_FRESH = 1;

    // The fetch failed; the cached origin/<default>.
    BASE_RESOLUTION_CACHED = 2;

    // No remote-tracking ref at all, or the `shared` policy.
    BASE_RESOLUTION_INSTANCE_HEAD = 3;

    BASE_RESOLUTION_PARENT = 4;

    BASE_RESOLUTION_REQUESTED = 5;

    // A redelivered spawn or a revival: the checkout was already there.
    BASE_RESOLUTION_REUSED = 6;
  }

  message Repo {
    string repo_name = 1;

    string branch = 2;

    string base_commit_sha = 3;

    BaseResolution resolution = 4;

    // For REQUESTED and PARENT.
    string requested_ref = 5;

    // The last successful fetch behind the base.
    google.protobuf.Timestamp fetched_at = 6;

    // Non-empty is the warning: why the base is not fresh.
    string stale_reason = 7;
  }

  repeated Repo repos = 1;

  CheckoutMode mode = 2;

  // Every repo the agent could check out (the manifest's set).
  repeated string available_repos = 3;
}

enum CleanupTier {
  CLEANUP_TIER_UNSPECIFIED = 0;

  // Ran the repo's reclaim command; worktree, branch and commits stay.
  CLEANUP_TIER_SOFT = 1;

  // Removed the worktree and its branch, after pinning HEAD.
  CLEANUP_TIER_HARD = 2;

  // Dropped an archive pin.
  CLEANUP_TIER_UNPIN = 3;

  // Removed a whole Instance.
  CLEANUP_TIER_INSTANCE = 4;
}

enum CleanupTrigger {
  CLEANUP_TRIGGER_UNSPECIFIED = 0;

  CLEANUP_TRIGGER_ARCHIVE = 1;

  CLEANUP_TRIGGER_IDLE = 2;

  CLEANUP_TRIGGER_DISK_PRESSURE = 3;

  CLEANUP_TRIGGER_EXPLICIT = 4;

  CLEANUP_TRIGGER_PURGE = 5;

  // The Worker's periodic scan: orphans, an expired archive grace period.
  CLEANUP_TRIGGER_SCAN = 6;
}

// One cleanup decision on one checkout (or pin, or Instance).
message WorkspaceCleanup {
  message RetainedFile {
    // Repo-relative.
    string path = 1;

    uint64 bytes = 2;
  }

  message RepoAction {
    enum Outcome {
      OUTCOME_UNSPECIFIED = 0;

      OUTCOME_DONE = 1;

      // A dry run's answer for an action that would have run.
      OUTCOME_WOULD_DO = 2;

      OUTCOME_SKIPPED = 3;

      // Not provably lossless, so not done.
      OUTCOME_REFUSED = 4;

      OUTCOME_FAILED = 5;
    }

    string repo_name = 1;

    Outcome outcome = 2;

    // "untracked files: 3", "no reclaim command", "timed out after 10m".
    string reason = 3;

    // The reclaim command run, if any.
    repeated string argv = 4;

    int32 exit_code = 5;

    // The last 4 KiB of stdout and stderr.
    string output_tail = 6;

    uint64 bytes_freed = 7;

    // HARD: what refs/horde/archived/<agent> now holds.
    string pinned_commit_sha = 8;

    // Ignored files outside every reclaim output path: what a forced hard
    // removal would delete that cannot be recovered (ADR-0014 resolution 2).
    repeated RetainedFile unrecoverable_files = 9;
  }

  WorkerId worker_id = 1;

  WorkspaceDefinitionId workspace_definition_id = 2;

  // Empty for an INSTANCE action and a pin with no ledger.
  AgentId agent_id = 3;

  // From the checkout ledger; may be empty for orphans.
  SessionId session_id = 4;

  CleanupTier tier = 5;

  CleanupTrigger trigger = 6;

  // EXPLICIT and PURGE.
  string gc_request_id = 7;

  bool dry_run = 8;

  repeated RepoAction repos = 9;
}

enum GcLevel {
  // Reads as AUTOMATIC.
  GC_LEVEL_UNSPECIFIED = 0;

  // Soft reclaim only.
  GC_LEVEL_SOFT = 1;

  // Soft plus lossless hard removal of archived checkouts: what the triggers
  // would do.
  GC_LEVEL_AUTOMATIC = 2;

  // Plus orphans, pins and retained checkouts: lossless unless forced.
  GC_LEVEL_HARD = 3;
}

// Server-appended in the housekeeping stream by the gc, instance-remove and
// delete --purge RPCs. Targets are resolved at request time, so the command
// fold stays a pure function of the log.
message WorkspaceGcRequested {
  string request_id = 1;

  repeated WorkerId worker_ids = 2;

  // Empty: every Instance on the targets.
  WorkspaceDefinitionId workspace_definition_id = 3;

  // Empty: every checkout.
  repeated AgentId agent_ids = 4;

  GcLevel level = 5;

  bool force = 6;

  bool dry_run = 7;

  bool remove_instance = 8;

  bool include_pins = 9;

  // The requesting principal, from its certificate (ADR-0009).
  string requested_by = 10;
}

// A Worker's answer to one WorkspaceGcRequested, after its WorkspaceCleanup
// events.
message WorkspaceGcCompleted {
  string request_id = 1;

  WorkerId worker_id = 2;

  uint32 actions_done = 3;

  uint32 actions_refused = 4;

  uint64 bytes_freed = 5;

  // The whole request failed, e.g. the Worker has no workspace support.
  string error = 6;
}

// The disk stayed below the low watermark after every permitted reclaim.
// One per pressure episode.
message WorkspaceDiskPressure {
  WorkerId worker_id = 1;

  uint64 free_bytes = 2;

  uint64 low_watermark_bytes = 3;

  // True: nothing reclaimable was left.
  bool exhausted = 4;
}

// A late journal entry from an Agent's former placement (ADR-0011): the
// Worker that journaled it no longer holds the Agent, because the Agent was
// re-placed or declared lost while the Worker was partitioned away. Kinds that
// are pure history (output, usage) land as themselves; everything else would
// overwrite what the current placement says — a lifecycle, a permission
// request the current Worker cannot answer, a result from a superseded
// incarnation — so it is recorded here instead, whole, in the Agent's Session,
// under the Worker's origin and the entry's journal_sequence: visible to every
// attached Client, never silently dropped, and still advancing the Worker's
// journal watermark.
message StaleJournalEvent {
  WorkerId worker_id = 1;

  uint64 journal_sequence = 2;

  // Where the Agent is placed now; unset when it is queued or lost.
  WorkerId current_worker_id = 3;

  // The original event's kind, as its Event.kind field name.
  string kind = 4;

  string reason = 5;

  // The entry as the Worker journaled it.
  Event event = 6;
}

// An operator reset a Worker's journal (ADR-0011) — the recovery for a Worker
// whose journal regressed, such as a fresh state directory after a disk loss.
// From this event on, the Worker's journal positions are numbered above
// journal_floor in the log (so its fresh journal neither collides with nor is
// mistaken for the lost one), its command stream starts over at sequence 1,
// and the Agents it held are declared lost.
message WorkerJournalReset {
  WorkerId worker_id = 1;

  // The highest journal position the log held for this Worker at the reset.
  uint64 journal_floor = 2;

  Actor reset_by = 3;

  string reason = 4;
}

// A journaled event the Server refused: a kind only the Server writes, a
// reserved stream, an Agent not placed on the journaling Worker, or a
// malformed entry. Appended in the refused event's place — under the Worker's
// origin and the refused event's journal_sequence — so the refusal is
// auditable, the Worker's journal watermark advances past it, and a replay of
// the same event deduplicates onto this record. Without it, a refused event
// stopped the journal and the Worker re-offered it on every reconnect,
// forever.
message JournalEventRefused {
  WorkerId worker_id = 1;

  uint64 journal_sequence = 2;

  // The stream the refused event targeted; unset when it named none.
  SessionId session_id = 3;

  // The refused event's kind, as its Event.kind field name; empty when the
  // entry carried no event.
  string kind = 4;

  // Why, in words an operator can act on.
  string reason = 5;
}

// An Event as it sits in a Session's log.
message EventEnvelope {
  SessionId session_id = 1;

  // Per-Session, dense, 1-based, assigned by the Server on append.
  uint64 sequence = 2;

  // When the Server appended it. Monotonic with sequence.
  google.protobuf.Timestamp recorded_at = 3;

  Event event = 4;
}

// An Event in a Worker's local journal, on its way up. Survives partitions: the
// Worker keeps producing these while disconnected and replays from the last
// acked sequence on reconnect.
message JournaledEvent {
  // Per Worker, dense, 1-based, monotonic across reconnects and restarts.
  uint64 journal_sequence = 1;

  SessionId session_id = 2;

  Event event = 3;
}
