[workspace]
resolver = "3"
# A glob, not a list: every crate under crates/ is a member, so a new crate
# joins by existing rather than by remembering to edit this line. The gauntlet
# measures whatever `cargo metadata` reports, so the two cannot drift.
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
# The TLS stack is pinned exactly (`=`): certificate issuance and verification
# are calibration-sensitive the same way gate tool versions are — a silently
# moved rustls default is how a security property changes between two builds.
# All of it is rustls-on-ring; nothing here may enable aws-lc, because two
# enabled crypto providers make `rustls::ServerConfig::builder()` ambiguous.
getrandom = "=0.3.4"
hex = "=0.4.3"
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = "=0.3.55"
tokio = { version = "1.53.1", default-features = false }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = "=0.18.1"

horde-adapter = { path = "crates/horde-adapter" }
horde-adapter-claude = { path = "crates/horde-adapter-claude" }
horde-adapter-codex = { path = "crates/horde-adapter-codex" }
horde-adapter-fake = { path = "crates/horde-adapter-fake" }
horde-cli = { path = "crates/horde-cli" }
horde-identity = { path = "crates/horde-identity" }
horde-proto = { path = "crates/horde-proto" }
horde-relay = { path = "crates/horde-relay" }
horde-server = { path = "crates/horde-server" }
horde-server-testkit = { path = "crates/horde-server-testkit" }
horde-testkit = { path = "crates/horde-testkit" }
horde-tui = { path = "crates/horde-tui" }
horde-wire = { path = "crates/horde-wire" }

[workspace.lints.rust]
# Deliberately *not* `warnings = "deny"`: denying every present and future rustc
# warning from the manifest turns a toolchain bump into a broken build. The
# `clippy` gate passes `-D warnings` instead, so the policy lives in one place
# (the gate) and local `cargo build` stays usable.
#
# Everything listed here is already satisfied by every crate in the workspace.
# `missing_docs` and `missing_debug_implementations` are deliberately NOT here:
# they would red the clippy gate on 171 pre-existing items across five crates
# whose owners never adopted them. Adopting them workspace-wide is a real and
# worthwhile change — it is just a documentation task someone has to schedule,
# not something to smuggle in through a lint table. horde-gauntlet holds itself
# to both, via inner attributes in its own crate root.
unsafe_code = "forbid"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# docs/TESTING.md §4. `unwrap` is additionally banned in tests via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
debug = "line-tables-only"
