[package]
name = "horde-server-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Shared server-harness test support: both service spines on a loopback socket, session seeding, and the worker-shaped journal push."

[lints]
workspace = true

[dependencies]
horde-cli = { workspace = true }
horde-identity = { workspace = true }
# Only for the OTLP variable names the scrubbed binary runner scrubs, so the
# list cannot drift from the config surface it protects tests from.
horde-observe = { workspace = true }
horde-proto = { workspace = true }
horde-server = { workspace = true }
# The secured harness's process-wide trust root persists its CA into a
# throwaway directory it holds for the process's life — and the blob-store
# harness tests root their stores the same way.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "process", "rt", "sync"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["channel", "router", "server", "tls-ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
