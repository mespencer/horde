[package]
name = "horde-fault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The fault-injection suite (docs/TESTING.md §2): process-level fault harnesses, the worker-runner fixture, and the scenarios that assert recovery."

[lints]
workspace = true

[dependencies]
# The fixture binaries compose the production libraries — the worker-runner
# wires journal, runtime and connection around the FakeAdapter; the
# fault-server wires horde_server::startup's parse/serve/announce — so the
# processes the suite kills are running the real code end to end. Both are
# ordinary dependencies because bins cannot use dev-dependencies.
horde-adapter-fake = { workspace = true }
horde-identity = { workspace = true }
horde-server = { workspace = true }
horde-worker = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
horde-cli = { workspace = true }
horde-proto = { workspace = true }
horde-server-testkit = { workspace = true }
horde-testkit = { workspace = true }
tempfile = { workspace = true }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["channel", "router", "server", "tls-ring"] }

[[bin]]
name = "worker-runner"
path = "src/bin/worker_runner.rs"

[[bin]]
name = "fault-server"
path = "src/bin/fault_server.rs"

# The scenarios are one consolidated binary, like every other suite here.
[[test]]
name = "fault_suite"
path = "tests/fault_suite/main.rs"
