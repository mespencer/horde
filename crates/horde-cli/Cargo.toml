[package]
name = "horde-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The `horde` client: a typed control-plane client library and the CLI over it."

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
horde-adapter = { path = "../horde-adapter" }
# Enrollment is a client verb (DESIGN §3: "horde worker enroll", and clients
# enroll identically), and the mTLS channel config is the identity crate's.
horde-identity = { workspace = true }
# The binary's OTLP opt-in (DESIGN §12): export-only subscriber, since this
# binary's stdout is the TUI and its stderr the refusal channel.
horde-observe = { workspace = true }
horde-proto = { workspace = true }
# The single owner of the domain↔wire correspondence. A narrowing arrives here
# as JSON and has to reach the wire as a `Struct`, and that conversion has real
# failure modes — a non-object bag, an integer with no exact double — which are
# already decided and tested there. Re-deriving them here would be a second
# answer to a settled question.
horde-wire = { path = "../horde-wire" }
# The TUI's state machine and renderer; this crate adds only the terminal
# plumbing and the client wiring around it (DESIGN.md §11: two frontends,
# one client library).
horde-tui = { workspace = true }
ratatui = "0.30.2"
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["channel", "tls-ring"] }
tracing = "0.1.44"

[dev-dependencies]
horde-server-testkit = { workspace = true }
# The secured suite asserts effects on the server the harness stands up, and
# stores joined identities in throwaway directories.
horde-server = { workspace = true }
tempfile = { workspace = true }
# Only the PTY suite in tests/tui.rs: the interactive shell around the event
# loop needs a real terminal to be tested honestly, and a pty is the only
# terminal a test can own.
portable-pty = "0.9.0"
tonic = { version = "0.14.6", features = ["channel", "server", "router"] }

[[bin]]
name = "horde"
path = "src/bin/horde.rs"
