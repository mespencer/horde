[package]
name = "horde-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Shared test infrastructure: golden transcript loading and the adapter conformance suite."

[lints]
workspace = true

[dependencies]
horde-adapter = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The fault injector (docs/TESTING.md §2) is a TCP proxy: it needs sockets,
# timers and tasks. Every consumer of this crate already builds tokio.
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = { workspace = true }
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
