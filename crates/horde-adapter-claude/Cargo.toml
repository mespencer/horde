[package]
name = "horde-adapter-claude"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Claude Code stream-json codec: wire types, turn assembly, usage normalization, and the permission-prompt contract."

[lints]
workspace = true

[dependencies]
horde-adapter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
horde-testkit = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread"] }
