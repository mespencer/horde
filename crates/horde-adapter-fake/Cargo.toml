[package]
name = "horde-adapter-fake"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A scripted provider harness: a real alternate adapter backend for orchestration tests."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
horde-adapter = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }

# The endpoint client (`Step::UseHordeTool` against a real endpoint) is a
# hand-rolled legacy-era JSON-RPC POST over hyper. Deliberately not an MCP
# client crate: `horde-cli` depends on this crate, so reaching for `horde-mcp`
# here would close a dependency cycle.
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
horde-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
