[package]
name = "horde-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The single owner of the domain↔wire correspondence between horde-adapter and horde.v1."

[lints]
workspace = true

# Depends on both sides precisely so neither has to depend on the other:
# horde-adapter stays free of protobuf, and horde-proto stays free of domain
# semantics. The Worker consumes this crate; nothing consumes the Worker.
[dependencies]
horde-adapter = { path = "../horde-adapter" }
# Diagnostic logs (ADR-0015): the reader and redactor on one side, the
# frames on the other, and the serving loop the server and worker share.
horde-observe = { workspace = true }
horde-proto = { path = "../horde-proto" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
