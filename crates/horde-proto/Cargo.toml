[package]
name = "horde-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Wire contracts for Horde: generated types and gRPC stubs for package horde.v1."

[lints]
workspace = true

[dependencies]
prost = "0.14.4"
prost-types = "0.14.4"
# The blob transfer helpers (`blob.rs`) drive the generated BlobService
# client over a concrete `tonic::transport::Channel`, hence "channel".
sha2 = { workspace = true }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["channel"] }
# Referenced by the generated service stubs (ProstCodec), not by handwritten
# code, so it is a direct dependency without a direct `use`.
tonic-prost = "0.14.6"

[dev-dependencies]
# The transfer-loop suite serves a scripted BlobService over a real
# loopback socket: the loops under test are chunking and verification, and
# both only exist across a transport.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["channel", "router", "server"] }

[build-dependencies]
# build.rs canonicalizes the proto root without Windows' verbatim prefix.
dunce = "1.0.5"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[package.metadata.cargo-machete]
# `tonic-prost` is used only from code generated into OUT_DIR, which machete
# does not scan. The build-dependencies are used by build.rs, which
# machete does not scan either — see docs/QUALITY_GATES.md, machete section.
ignored = [
    "tonic-prost",
    "dunce",
    "prost-build",
    "protoc-bin-vendored",
    "tonic-prost-build",
]
