[package]
name = "horde-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The end-to-end tier: horde-server, horde-worker and horde as real separate processes over real TCP with real identities."

[lints]
workspace = true

# The scripted provider login command the login scenarios relay to
# (DESIGN §4). std-only on purpose, so the bin target costs a plain build
# nothing; it lives here because the e2e tier is its only consumer.
[[bin]]
name = "fake-login"
path = "src/bin/fake_login.rs"

# Everything lives in dev-dependencies: this crate is its test suite. The
# library target exists only to give the suite a crate to belong to, so a
# plain `cargo build` never pays for the e2e harness.
[dev-dependencies]
# The scenarios drive everything through the product binaries' own operator
# interfaces — stdout lines and `--json` renders — so the suite needs no wire
# types and no client library of its own (the raw-client stand-ins left with
# fix a12).
horde-server-testkit = { workspace = true }
# The login scenarios drive the real `horde worker login` inside a pty —
# the raw-mode terminal shell is part of what they hold to account.
portable-pty = "0.9.0"
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }
