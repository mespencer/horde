[package]
name = "horde-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The Worker: supervises provider harnesses as child processes and drives them through their codecs."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# The daemon's command line (`--help`, and refusals that name the flag),
# the same parser the `horde` CLI and `horde-server` use.
clap = { version = "4.5", features = ["derive"] }
horde-adapter = { workspace = true }
# The scripted hermetic provider (TESTING.md §3) is a product surface of the
# daemon, not only a test double: `horde-worker --adapter fake` is what lets
# the end-to-end suite run this binary for real without a provider login.
horde-adapter-fake = { workspace = true }
# The worker's config file (ADR-0016): the strict reader and provenance
# every role shares.
horde-config = { workspace = true }
horde-identity = { workspace = true }
# The per-agent MCP endpoint (DESIGN §5, ADR-0004): the Worker stands one up
# per Session, mints each agent's token, and supplies the journal sink and
# control-plane channel — the three things the ADR's note left to this crate.
horde-mcp = { workspace = true }
# The control-plane client the endpoint's verbs issue RPCs through, over the
# Worker's own authenticated channel.
horde-cli = { workspace = true }
# Token minting for the endpoint's per-agent identity pair.
getrandom = { workspace = true }
hex = { workspace = true }
horde-adapter-claude = { workspace = true }
horde-adapter-codex = { workspace = true }
# The daemon's OTLP opt-in (DESIGN §12), wired like the other two binaries.
horde-observe = { workspace = true }
horde-proto = { workspace = true }
# The share layer: observe_head for stamping a result's Payload, and the
# stage/obtain halves of moving a commit between checkouts (DESIGN §5, §8).
horde-relay = { workspace = true }
horde-wire = { workspace = true }
# The interactive-auth relay's PTY (DESIGN §4): provider login commands run
# in a real terminal the client's keystrokes are relayed into.
portable-pty = "0.9.0"
# Signalling harness process groups (ADR-0010): killpg through a safe API,
# because the workspace forbids `unsafe`.
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
# The checkout ledger and the workspace manifest (ADR-0014) are JSON files.
serde = { workspace = true }
serde_json = { workspace = true }
# Owner-only secret files (ADR-0010): an MCP config carrying a bearer token
# lives exactly as long as the harness that reads it.
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["channel", "tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
# The connection suite's partitions are injected through the promoted fault
# injector — the instrument that grew out of this suite's SeverableProxy seed.
# (horde-adapter-fake is an ordinary dependency now: the daemon ships it.)
horde-testkit = { workspace = true }
# The mTLS dial test enrolls through the shared secured harness, so the
# certificate it dials with came off the production issuance path.
# (serde_json is already an ordinary dependency of this crate.)
horde-server-testkit = { workspace = true }
# The dial tests run the real server over a real socket. The dependency points
# this way only — horde-server knows nothing about the worker — so there is no
# cycle, and it is the shape horde-cli already uses to test its client against a
# server it stands up itself.
horde-server = { workspace = true }
tokio = { workspace = true, features = ["net", "test-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14.6", features = ["channel", "router", "server"] }

# The Worker daemon (DESIGN §2's third binary): enrolls, dials the Server
# over mTLS, and runs the full Runtime until terminated.
[[bin]]
name = "horde-worker"
path = "src/bin/horde_worker.rs"

# The stub harness is a real binary the process tests spawn, so supervision is
# exercised over real stdio rather than simulated.
[[bin]]
name = "stub-harness"
path = "src/bin/stub_harness.rs"

# Its codex counterpart: a scripted app-server the codex supervision tests
# drive over real stdio.
[[bin]]
name = "codex-stub-harness"
path = "src/bin/codex_stub_harness.rs"
