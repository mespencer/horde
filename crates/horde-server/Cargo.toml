[package]
name = "horde-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The Horde control plane: the append-only event log and the service spines built on it."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
horde-identity = { workspace = true }
# The hub core (ADR-0004): upstream connections and the namespaced routing
# the worker-forwarded hub calls are answered from.
horde-mcp = { workspace = true }
# The git Relay, mounted by --serve --relay-bind (DESIGN §8, wave-7 fix a10).
horde-relay = { workspace = true }
# The binary's OTLP opt-in (DESIGN §12): subscriber composition and the
# export pipeline both live there, where they are testable.
horde-observe = { workspace = true }
horde-proto = { workspace = true }
prost = "0.14.4"
prost-types = "0.14.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "process"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["server", "channel", "tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
# A dev-dependency on a crate that depends on this one. Cargo permits the
# cycle — dev-dependencies are outside the package's own build graph — and it
# is what lets the server's tests share the harness its clients test against.
horde-server-testkit = { workspace = true }
# The enrollment e2e replays the enrollment stream the way an attached
# client does; the typed client is the production read path being claimed.
horde-cli = { workspace = true }
tempfile = "3.24.0"
hyper-util = { version = "0.1", features = ["tokio"] }
proptest = "1.9.0"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "horde-server"
path = "src/bin/horde_server.rs"
