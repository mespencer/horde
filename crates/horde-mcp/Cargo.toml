[package]
name = "horde-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The agent-facing MCP endpoint: orchestrator verbs and permission prompting, one endpoint per Agent."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }

# Pinned exactly. The audit (docs/research/mcp-2026-audit.md §3) recorded rmcp
# going 3.0.0 -> 3.1.2 in eleven days, and the dual-era spike's findings —
# `ProtocolVersion::LATEST` being 2025-11-25, the `legacy_session_mode`
# consequences, the `allowed_origins` default — are all properties of 3.1.2
# specifically. A caret range would let any of them change under us silently.
rmcp = { version = "=3.1.2", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    # The hub half (ADR-0004): Horde-as-MCP-client consuming user servers.
    # `transport-child-process` spawns stdio servers (hub-side once, or
    # worker-side per agent for `local` configs) and kills the child by
    # handle on drop; the reqwest streamable-HTTP client is both the dial
    # tone for http upstreams and the worker's link to the hub endpoint.
    # `reqwest` (not reqwest-native-tls) keeps the TLS stack rustls, like
    # every other channel in the workspace.
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

# The endpoint reads per-request identity off the HTTP parts rmcp injects into
# the request context, so the http types are part of this crate's own surface
# rather than an implementation detail of the transport.
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
# The hub link's HTTP client, handed to rmcp's streamable-http transport.
# rustls, not native-tls, like every other channel in the workspace.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
tower-service = "0.3"

schemars = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1.44"

# The provider-specific half of permission prompting. DESIGN §10 routes Claude's
# `--permission-prompt-tool` through this endpoint, and the payload contract for
# it — including the rule that an unmodified allow must echo the proposal back
# rather than omit `updatedInput` — is already owned and tested by the adapter.
# The arrow points this way deliberately: an integration crate depending on a
# provider crate is layering; the reverse would be the smell.
horde-adapter = { path = "../horde-adapter" }
horde-adapter-claude = { path = "../horde-adapter-claude" }
# The mTLS termination for an endpoint bound beyond loopback (DESIGN §3):
# the acceptor and its revocation-aware verifier have one owner.
horde-identity = { workspace = true }
horde-cli = { path = "../horde-cli" }
horde-proto = { path = "../horde-proto" }
horde-wire = { path = "../horde-wire" }

tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tonic = { version = "0.14.6", features = ["channel"] }

[dev-dependencies]
# The TLS round-trip needs the client half of a rustls connection.
tokio-rustls = { workspace = true }
# The tests drive this endpoint against a real ControlPlane over a real socket,
# through the harness `horde-server-testkit` shares with `horde-cli` and
# `horde-server`'s own suites. The dependency points one way only —
# horde-server knows nothing about this crate — so there is no cycle.
horde-server-testkit = { workspace = true }
# The chain e2e configures the server's permission modes and scripts its
# Policy Judge, which are `horde-server::permission` types.
horde-server = { workspace = true }
# The HTTP round-trip tests speak a legacy-era JSON-RPC POST at the served
# endpoint themselves, which needs the client half of hyper and a collector
# for the answer's body.
http-body-util = "0.1"
hyper = { version = "1", features = ["client"] }
tempfile = { workspace = true }
# `process` is for the live smoke test, which spawns a real `claude`. Declared
# here rather than relied on from workspace feature unification: this crate must
# build on its own, and a feature it gets only because a sibling happens to
# enable it is one that disappears the day the sibling stops.
tokio = { workspace = true, features = ["process"] }
tonic = { version = "0.14.6", features = ["channel", "router", "server"] }
