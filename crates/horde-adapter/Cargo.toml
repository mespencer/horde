[package]
name = "horde-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "The provider-harness seam: the Adapter trait and the domain types every provider is normalized into."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The stderr sink is a task-local (ADR-0015): scoped around a spawn by the
# Worker, captured by whatever starts the harness inside it.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
