[package]
name = "claude-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Empty workspace table keeps this throwaway spike crate OUT of the Horde
# workspace. Delete the whole `spikes/` tree once the real adapter lands.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "rt-multi-thread", "time"] }
