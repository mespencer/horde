# cargo-mutants configuration. Read by the `mutants` gate, which passes only
# scope flags on the command line.
#
# There are deliberately no `exclude_re` entries: skipping a function because
# its mutants survive is how a mutation gate becomes decorative. If a function
# cannot be mutation-tested, the fix is to move its logic somewhere that can be.

# Almost all of a mutant's cost is rebuilding the crate, which is largely
# single-threaded, so several mutants at once is close to a linear speed-up.
# A gate nobody can afford to run is a gate nobody runs; the timeouts below are
# generous enough that the extra load does not turn into spurious timeouts.
jobs = 4

# Tests here are in-process and finish in milliseconds; the floor exists so a
# cold or contended machine does not report a spurious timeout.
minimum_test_timeout = 60

# A mutant that hangs usually hangs badly. Five times the clean-tree test time
# is generous enough to avoid false timeouts without stalling a run.
timeout_multiplier = 5.0

# Mutants often produce code that takes longer to compile than the original.
build_timeout_multiplier = 5.0
