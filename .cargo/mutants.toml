# cargo-mutants configuration. Read by the `mutants` gate, which passes only
# scope flags on the command line.
#
# Skipping a function because its mutants survive is how a mutation gate becomes
# decorative, so the bar for an entry below is not "hard to test" but "no test
# could possibly exist": the mutated expression has to be identical to the
# original. A survivor that is merely awkward is a finding, and the fix is to
# move its logic somewhere that can be tested.
#
# The gate enforces this rather than trusting it. It lists the mutants twice,
# with this file and without it, and refuses an entry that names nothing, that
# was configured but did not apply, that removed no mutant at all, or that
# removed more than the one expression its comment argues about. It also refuses
# any difference between the two listings that no entry accounts for.
exclude_re = [
    # `Capabilities::none()` is written `Self::default()`, and `Capabilities`
    # derives `Default`. cargo-mutants' mutation of it is
    # `-> Self with Default::default()`: the same expression, character for
    # character. No test can distinguish the two, and one written to look as if
    # it had would be asserting on nothing.
    'Capabilities::none',
    # `Script::echoing()` is `Self::default()` for the same reason, over a
    # `Script` that also derives `Default`.
    'Script::echoing',
    # Test fixture: the process suite spawns this binary, so mutating it measures
    # the fixture rather than the code under test.
    'crates/horde-worker/src/bin/stub_harness\.rs',
    # Same criterion, codex's half: a scripted app-server the codex supervision
    # tests spawn. The suite runs it; it never tests it.
    'crates/horde-worker/src/bin/codex_stub_harness\.rs',
    # Same criterion, the fault suite's half: the worker-runner and the
    # fault-server are production libraries composed into killable
    # processes. The fault scenarios spawn them and SIGKILL them; they test
    # nothing, and the library code they compose is mutated in its own
    # crates.
    'crates/horde-fault/src/bin/worker_runner\.rs',
    'crates/horde-fault/src/bin/fault_server\.rs',
    # Same criterion, the hub's half: a stub MCP server the hub upstream tests
    # spawn as a child process (main.rs), whose toolset (tools.rs) the duplex
    # tests also include by #[path]. The suite runs both; it tests neither.
    'crates/horde-mcp/src/bin/mcp_stub_server/main\.rs',
    'crates/horde-mcp/src/bin/mcp_stub_server/tools\.rs',
    # A different criterion, and the only entry under it: code that sends
    # real signals to targets chosen at runtime must never be mutated,
    # because a mutant runs for real. Its mutants are not equivalent; they
    # are dangerous. Flipping `ppid == parent` in an earlier version of this
    # file made a test SIGKILL every process on the machine. The file holds
    # only the signal guard, the orphan sweep's selection and the sending;
    # the harmless table reading it needs lives in `ps.rs` and is mutated.
    'crates/horde-server-testkit/src/reap\.rs',
    # A third criterion: code this host never compiles. Each crate's Windows
    # bodies (ADR-0017) live in one `windows.rs` whose every item is
    # `cfg(windows)`, behind a function that every platform calls. A mutant
    # there changes no byte of the Linux build, so it can only "survive" —
    # it is not a finding and no Linux test could catch it. Those files are
    # pinned by `cfg(windows)` tests run on a Windows machine instead, and
    # `clippy-windows` keeps them compiling. Only `cfg(windows)` items
    # belong in these files; anything that compiles here belongs elsewhere,
    # where it is mutated.
    'crates/horde-cli/src/windows\.rs',
    'crates/horde-server/src/windows\.rs',
    'crates/horde-server-testkit/src/windows\.rs',
    'crates/horde-worker/src/windows\.rs',
]

# Parallelism is not settable here — cargo-mutants takes `--jobs` on the command
# line only — so it lives in the gate, like every other flag.
#
# Tests here are in-process and finish in milliseconds; the floor exists so a
# cold or contended machine does not report a spurious timeout.
minimum_test_timeout = 60

# A mutant that hangs usually hangs badly. Five times the clean-tree test time
# is generous enough to avoid false timeouts without stalling a run.
timeout_multiplier = 5.0

# Mutants often produce code that takes longer to compile than the original.
build_timeout_multiplier = 5.0
